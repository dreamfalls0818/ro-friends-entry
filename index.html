<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="ro-entry-version" content="2">
<title>RO 好友世界</title>
<style>:root{color-scheme:dark;font:16px/1.8 "Microsoft JhengHei",system-ui,sans-serif;color:#eee7d7;background:#101d22}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#274849,transparent 70%)}main{box-sizing:border-box;width:min(92vw,560px);padding:40px 30px;border:1px solid #71846b;border-radius:16px;background:#14292dd9;box-shadow:0 24px 80px #0005}small{color:#c6b482;letter-spacing:.12em}h1{font-size:30px;margin:8px 0 22px}p{color:#c7d4d1}button{font:inherit;border:0;border-radius:7px;background:#e0c68e;color:#183235;padding:10px 24px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}footer{font-size:13px;color:#9eafaa;margin-top:28px}#status{min-height:70px;white-space:pre-line}a{color:#e0c68e}</style>
<main><small>RO · 好友冒險</small><h1>我們的好友世界</h1><p id="status" role="status">正在確認世界入口…</p><button id="retry">重新連線</button><footer>主機電腦與遊戲服務須保持開啟。<br>此頁不收取遊戲帳號或密碼。</footer></main>
<script>
const status=document.getElementById('status'),retry=document.getElementById('retry');
const bytes=value=>Uint8Array.from(atob(value.replaceAll('-','+').replaceAll('_','/')),c=>c.charCodeAt(0));
async function connect(){
 retry.disabled=true;
 try{
  const keyText=new URLSearchParams(location.hash.slice(1)).get('key');
  if(!keyText||!/^[A-Za-z0-9_-]{43}$/.test(keyText))throw Error('請使用主機提供的完整入口連結。\n目前連結缺少入口邀請碼。');
  status.textContent='正在取得最新入口…';
  // A branch URL on raw.githubusercontent.com can retain an older invitation
  // even with a cache-busting query. Resolve live contents through the public API.
  const response=await fetch('https://api.github.com/repos/dreamfalls0818/ro-friends-entry/contents/state.json?ref=live&v='+Date.now(),{headers:{Accept:'application/vnd.github+json'},cache:'no-store',credentials:'omit',signal:AbortSignal.timeout(15000)});
  if(response.status===403||response.status===429)throw Error('固定入口查詢暫時受限，請稍後再試。');
  if(!response.ok)throw Error('入口資料暫時無法讀取，請稍後重試。');
  const file=await response.json();
  if(file.encoding!=='base64'||typeof file.content!=='string')throw Error('入口資料格式尚未就緒。');
  const record=JSON.parse(new TextDecoder().decode(bytes(file.content)));if(record.v!==1)throw Error('入口資料版本尚未就緒。');
  const key=await crypto.subtle.importKey('raw',bytes(keyText),'AES-GCM',false,['decrypt']);
  let payload;
  try{payload=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(record.iv)},key,bytes(record.data))));}
  catch{throw Error('入口邀請碼不正確，請向主機索取完整連結。');}
  if(!payload.online)throw Error('好友世界目前未開放連線。\n請等主機開服後，再按重新連線。');
  const target=new URL(payload.invitation);
  if(target.protocol!=='https:'||target.username||target.password||target.port||!/^[a-z0-9-]+\.trycloudflare\.com$/.test(target.hostname)||!target.hash.startsWith('#invite='))throw Error('主機尚未提供可用的遊戲邀請。');
  status.textContent='入口已就緒，正在前往好友世界…';
  // Only the native game's invitation is forwarded. The fixed-entry key stays here.
  location.replace(target.href);
 }catch(error){status.textContent=error.message||'暫時無法連線，請稍後重試。';retry.disabled=false;}
}
retry.onclick=connect;connect();
</script></html>
